<div align="center">
  <style>
    /* 个人主页极简样式 */
    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
    }
    .name {
      font-size: 24px;
      font-weight: bold;
      color: #c9d1d9;
    }
    .bio {
      font-size: 16px;
      color: #8b949e;
      line-height: 1.5;
    }
    .tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }
    .tag {
      background: #21262d;
      color: #8b949e;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 12px;
      border: 1px solid #30363d;
    }
  </style>

  <div class="profile-card">
    <!-- 个人名片区 -->
    <div class="name">[ 你的名字 / ID ]</div>
    <div class="bio">[ 在这里写一句简短的自我介绍，比如：一个热爱算法与魔法世界的探索者 ]</div>
    
    <!-- 核心标签区 -->
    <div class="tags">
      <span class="tag">[ 标签1，如：OI选手 ]</span>
      <span class="tag">[ 标签2，如：C++ ]</span>
      <span class="tag">[ 标签3，如：Minecraft ]</span>
      <span class="tag">[ 标签4，如：哈利波特 ]</span>
    </div>
  </div>
</div>

<!-- 动态数据区（可选，放在名片下方） -->

  <br>
  !<Your GitHub Stats>
</div>
